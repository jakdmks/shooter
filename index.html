<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Shooter.</title>
    <link rel="stylesheet" href="./style.css">
    <!--<link rel="icon" href="./favicon.ico" type="image/x-icon">-->
  </head>
  <body>
	<div id="new-game-button-random" class="button green" onclick="newRandomGame()">NEW GAME!</div>
  
	<div id="screen" class="screen">
		<!-- Overlay for end-game stats -->
		<div id="endgame-overlay">
			<div id="stats-panel">
				<h2>Mission Complete!</h2>
					<div class="stats-grid">
						<div class="stat">
							<span class="label">Destroyed</span>
							<span class="value" id="stats-targets-destroyed">N/A</span>
						</div>
						<div class="stat">
							<span class="label">Accuracy</span>
							<span class="value" id="stats-accuracy">N/A</span>
						</div>
						<div class="stat">
							<span class="label">Time</span>
							<span class="value" id="stats-time">N/A</span>
						</div>
					</div>
			</div>
		</div>
		
		<!-- Overlay for reload -->
		<div id="reload-overlay">
			RELOAD!
		</div>
		
	</div>
	
	<div class="info" style="font-weight: bold" id="info-ammo"></div>
	<div class="info" id="info-bullets"></div>
	<div id="reload-button" class="button red" onclick="reload()" style="margin-top: 5px; visibility: hidden">RELOAD!</div>
	
  </body>
  <script src="scripts.js"></script>
</html>
